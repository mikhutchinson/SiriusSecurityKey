name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Format and provenance
        run: |
          swift format lint --recursive Sources Tests Package.swift Tools/ControlledRP/Package.swift Tools/ControlledRP/Sources Tools/ControlledRP/Tests
          jq empty References/upstream-lock.json References/upstream-inventory.json Tests/SiriusSecurityKeyTests/Vectors/hybrid-vectors.json Package.resolved Tools/ControlledRP/Package.resolved
      - name: Debug build
        run: swift build
      - name: Tests
        run: swift test
      - name: Sanitizers
        run: |
          swift test --sanitize=address
          swift test --sanitize=thread
      - name: Release build
        run: swift build -c release
      - name: Controlled RP harness
        run: |
          swift build --package-path Tools/ControlledRP
          swift test --package-path Tools/ControlledRP
          sh -n Tools/ControlledRP/build-app.sh
          Tools/ControlledRP/build-app.sh
          test "$(shasum -a 256 Tools/ControlledRP/.build/SiriusSecurityKeyControlledRP.app/Contents/Resources/SiriusSecurityKey_SiriusSecurityKey.bundle/effective_tld_names.dat | awk '{print $1}')" = "4155611645690529d1bbea0cfe653b0c45f63b028e0ba039de29a97edc3204ca"
      - name: iOS build
        run: xcodebuild -scheme SiriusSecurityKey -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
