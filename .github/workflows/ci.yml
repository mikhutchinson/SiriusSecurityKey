name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Debug build
        run: swift build
      - name: Tests
        run: swift test
      - name: Release build
        run: swift build -c release
